name: SynStudios Android Release Bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-debug-apk.sh"
      - "scripts/build-release-aab.sh"
      - "scripts/package-releases.sh"
      - "scripts/taylor_playstore_team.py"
      - "scripts/workers/**"
      - ".github/workflows/android-release-bundles.yml"

permissions:
  contents: write

jobs:
  taylor-audit-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Taylor production audit loop
        run: python3 scripts/taylor_playstore_team.py --mode production

      - name: Release readiness gate
        run: python3 scripts/release_readiness.py --audit --version "$(node -p "require('./package.json').version")"

      - name: Build debug APK
        run: bash scripts/build-debug-apk.sh

      - name: Build release AAB
        run: bash scripts/build-release-aab.sh

      - name: Package release bundles
        run: bash scripts/package-releases.sh

      - name: Read version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SynStudios v${{ steps.version.outputs.version }} Android bundles (build ${{ github.run_number }})
          body: |
            ## SynStudios Android release bundles

            Taylor production audit passed before packaging.

            | Artifact | Use |
            |----------|-----|
            | `synstudios-debug.apk` | Device testing — `adb install -r synstudios-debug.apk` |
            | `synstudios-release.aab` | Play Store upload (unsigned validation build from CI) |
            | `synstudios-v${{ steps.version.outputs.version }}.aab` | Versioned AAB copy |

            Built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            ### Verified by Taylor workers
            - W1–W7 Play Store gate
            - W8 SpriteStudio (Loop + onion skin)
            - W9 UnrealViewport
            - W10 AssetRoadmap
          files: |
            dist/synstudios-debug.apk
            dist/synstudios-release.aab
            dist/synstudios-v${{ steps.version.outputs.version }}.aab
          draft: false
          prerelease: false
          generate_release_notes: true
