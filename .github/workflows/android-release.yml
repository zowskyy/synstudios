name: SynStudios Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  taylor-playstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Taylor Play Store + asset workers
        run: |
          python3 scripts/workers/w1_brand_audit.py
          python3 scripts/workers/w4_feature_parity.py
          python3 scripts/workers/w6_release_ops.py
          python3 scripts/workers/w7_launch_continuity.py
          python3 scripts/taylor_asset_team.py

      - name: Build mobile static export
        run: npm run build:mobile

      - name: Capacitor sync
        run: npx cap sync android

      - name: Validate Android config
        run: python3 scripts/workers/w5_android_validate.py

      - name: Build release AAB (CI validation)
        working-directory: android
        run: ./gradlew bundleRelease
